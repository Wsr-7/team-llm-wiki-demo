# Reference implementation (job J1). In environments without GitHub Actions
# the company Jenkins pipeline is authoritative — see docs/ci.md.
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check
