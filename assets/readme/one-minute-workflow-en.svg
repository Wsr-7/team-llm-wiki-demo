<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">How it works in one minute</title>
  <desc id="desc">Quick capture stores raw material in inbox through a self-merged pull request without review. Formal pages go through domain-owner review and CI into reviewed English wiki pages, then people and agents consume them through cited answers.</desc>
  <rect width="1200" height="520" rx="28" fill="#1d2924"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="64" y="70" font-size="42" font-weight="750" fill="#f4f1e8">How it works in one minute</text>
    <text x="64" y="105" font-size="20" fill="#b9d3c3">Two lanes keep raw capture easy while reviewed knowledge remains citable.</text>

    <text x="64" y="151" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700" letter-spacing="1.5" fill="#b9d3c3">QUICK CAPTURE · ANYONE · ≤ 5 MIN</text>
    <path d="M284 231H320M534 231H570" stroke="#86a795" stroke-width="4" stroke-linecap="round"/>
    <path d="M310 221L320 231 310 241M560 221L570 231 560 241" fill="none" stroke="#b9d3c3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="64" y="175" width="220" height="112" rx="18" fill="#f4f1e8"/>
    <text x="88" y="216" font-size="27" font-weight="750" fill="#1d2924">Raw material</text><text x="88" y="248" font-size="18" fill="#53635b">Any language</text><text x="88" y="272" font-size="18" fill="#53635b">No format</text>
    <rect x="320" y="175" width="214" height="112" rx="18" fill="#fffdf8" stroke="#86a795" stroke-width="2"/>
    <text x="344" y="216" font-size="27" font-weight="750" fill="#1d2924">inbox/</text><text x="344" y="253" font-size="19" fill="#8a4a33">Unverified capture</text>
    <rect x="570" y="175" width="238" height="112" rx="18" fill="#47725d"/>
    <text x="594" y="216" font-size="25" font-weight="750" fill="#fffdf8">Self-merge PR</text><text x="594" y="253" font-size="19" fill="#d6e5dc">No review required</text>

    <text x="64" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700" letter-spacing="1.5" fill="#b9d3c3">FORMAL KNOWLEDGE · REVIEWED BEFORE USE</text>
    <path d="M294 416H330M530 416H566" stroke="#86a795" stroke-width="4" stroke-linecap="round"/>
    <path d="M320 406L330 416 320 426M556 406L566 416 556 426" fill="none" stroke="#b9d3c3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="64" y="360" width="230" height="116" rx="18" fill="#fffdf8" stroke="#86a795" stroke-width="2"/>
    <text x="88" y="402" font-size="27" font-weight="750" fill="#1d2924">Pull Request</text><text x="88" y="435" font-size="18" fill="#53635b">Domain owner review</text><text x="88" y="460" font-size="18" fill="#53635b">CI validation</text>
    <rect x="330" y="360" width="200" height="116" rx="18" fill="#47725d"/>
    <text x="354" y="402" font-size="27" font-weight="750" fill="#fffdf8">wiki/</text><text x="354" y="439" font-size="19" fill="#d6e5dc">Reviewed · English</text>
    <rect x="566" y="360" width="570" height="116" rx="18" fill="#f4f1e8"/>
    <text x="590" y="396" font-size="23" font-weight="750" fill="#1d2924">Consume</text>
    <text x="590" y="428" font-size="19" fill="#53635b">Humans · INDEX / GitHub</text>
    <text x="590" y="457" font-size="19" fill="#53635b">Agents · cited answers · unknown → page suggestion</text>
  </g>
</svg>
