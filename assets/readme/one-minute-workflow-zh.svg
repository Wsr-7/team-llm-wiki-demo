<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">一分钟看懂运作方式</title>
  <desc id="desc">从捕获原始上下文，到 Pull Request 审核，再到 wiki 入库和人或 Agent 带引用使用的四步流程。</desc>
  <rect width="1200" height="390" rx="28" fill="#1d2924"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="64" y="70" font-size="42" font-weight="750" fill="#f4f1e8">一分钟看懂运作方式</text>
    <text x="64" y="105" font-size="20" fill="#b9d3c3">快进一条原始经验，出来一条可追溯、可引用的团队知识。</text>
    <path d="M270 224H326M548 224H604M826 224H882" stroke="#86a795" stroke-width="4" stroke-linecap="round"/>
    <path d="M316 214L326 224 316 234M594 214L604 224 594 234M872 214L882 224 872 234" fill="none" stroke="#b9d3c3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="64" y="150" width="206" height="150" rx="18" fill="#f4f1e8"/><text x="88" y="187" font-size="18" font-weight="700" fill="#47725d">01 · 捕获</text><text x="88" y="222" font-size="27" font-weight="750" fill="#1d2924">原始上下文</text><text x="88" y="258" font-size="19" fill="#53635b">任何人 · ≤ 5 分钟</text>
      <rect x="342" y="150" width="206" height="150" rx="18" fill="#fffdf8" stroke="#86a795" stroke-width="2"/><text x="366" y="187" font-size="18" font-weight="700" fill="#47725d">02 · 候选</text><text x="366" y="222" font-size="27" font-weight="750" fill="#1d2924">Pull Request</text><text x="366" y="258" font-size="19" fill="#53635b">负责人评审 · CI</text>
      <rect x="620" y="150" width="206" height="150" rx="18" fill="#47725d"/><text x="644" y="187" font-size="18" font-weight="700" fill="#d6e5dc">03 · 入库</text><text x="644" y="222" font-size="27" font-weight="750" fill="#fffdf8">wiki/</text><text x="644" y="258" font-size="19" fill="#d6e5dc">已审核 · 可引用</text>
      <rect x="898" y="150" width="238" height="150" rx="18" fill="#f4f1e8"/><text x="922" y="187" font-size="18" font-weight="700" fill="#47725d">04 · 使用</text><text x="922" y="222" font-size="27" font-weight="750" fill="#1d2924">人和 Agent</text><text x="922" y="258" font-size="19" fill="#53635b">带来源回答</text>
    </g>
  </g>
</svg>
