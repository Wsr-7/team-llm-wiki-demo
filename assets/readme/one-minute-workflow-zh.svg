<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">一分钟看懂运作方式</title>
  <desc id="desc">快速收集通过无需审核的自行合并 PR 将原始材料存入 inbox。正式页面经过领域负责人审核和 CI 后进入已审核的英文 wiki，再由人和 Agent 使用。</desc>
  <rect width="1200" height="520" rx="28" fill="#1d2924"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="64" y="70" font-size="42" font-weight="750" fill="#f4f1e8">一分钟看懂运作方式</text>
    <text x="64" y="105" font-size="20" fill="#b9d3c3">两条路径兼顾低门槛收集与可信知识的引用边界。</text>

    <text x="64" y="151" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700" letter-spacing="1.5" fill="#b9d3c3">快速收集 · 任何人 · ≤ 5 分钟</text>
    <path d="M284 231H320M534 231H570" stroke="#86a795" stroke-width="4" stroke-linecap="round"/>
    <path d="M310 221L320 231 310 241M560 221L570 231 560 241" fill="none" stroke="#b9d3c3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="64" y="175" width="220" height="112" rx="18" fill="#f4f1e8"/>
    <text x="88" y="216" font-size="27" font-weight="750" fill="#1d2924">原始材料</text><text x="88" y="253" font-size="19" fill="#53635b">任意语言 · 无格式</text>
    <rect x="320" y="175" width="214" height="112" rx="18" fill="#fffdf8" stroke="#86a795" stroke-width="2"/>
    <text x="344" y="216" font-size="27" font-weight="750" fill="#1d2924">inbox/</text><text x="344" y="253" font-size="19" fill="#8a4a33">未核验收集</text>
    <rect x="570" y="175" width="238" height="112" rx="18" fill="#47725d"/>
    <text x="594" y="216" font-size="25" font-weight="750" fill="#fffdf8">自行合并 PR</text><text x="594" y="253" font-size="19" fill="#d6e5dc">无需审核</text>

    <text x="64" y="338" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700" letter-spacing="1.5" fill="#b9d3c3">正式知识 · 使用前审核</text>
    <path d="M294 416H330M530 416H566" stroke="#86a795" stroke-width="4" stroke-linecap="round"/>
    <path d="M320 406L330 416 320 426M556 406L566 416 556 426" fill="none" stroke="#b9d3c3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="64" y="360" width="230" height="116" rx="18" fill="#fffdf8" stroke="#86a795" stroke-width="2"/>
    <text x="88" y="402" font-size="27" font-weight="750" fill="#1d2924">Pull Request</text><text x="88" y="439" font-size="19" fill="#53635b">领域 owner 审核 · CI</text>
    <rect x="330" y="360" width="200" height="116" rx="18" fill="#47725d"/>
    <text x="354" y="402" font-size="27" font-weight="750" fill="#fffdf8">wiki/</text><text x="354" y="439" font-size="19" fill="#d6e5dc">已审核 · 英文</text>
    <rect x="566" y="360" width="570" height="116" rx="18" fill="#f4f1e8"/>
    <text x="590" y="396" font-size="23" font-weight="750" fill="#1d2924">使用</text>
    <text x="590" y="428" font-size="19" fill="#53635b">人 · INDEX / GitHub</text>
    <text x="590" y="457" font-size="19" fill="#53635b">Agent · 带引用回答 · 未知 → 建议建页</text>
  </g>
</svg>
