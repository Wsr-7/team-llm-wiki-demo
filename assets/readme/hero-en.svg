<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Team LLM Wiki</title>
  <desc id="desc">An evidence-backed, Git-managed knowledge base with reviewed pages containing source excerpts, evidence markers, and domain ownership.</desc>
  <rect width="1200" height="360" rx="28" fill="#f4f1e8"/>
  <path d="M660 0V360" stroke="#d4d0c4"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#1d2924">
    <text x="64" y="70" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700" letter-spacing="2.2" fill="#47725d">TEAM KNOWLEDGE · GIT-NATIVE</text>
    <text x="64" y="153" font-size="62" font-weight="750" letter-spacing="-2">Team LLM Wiki</text>
    <text x="64" y="198" font-size="27" font-weight="650">Evidence-backed knowledge</text>
    <text x="64" y="232" font-size="27" font-weight="650">people and AI agents can cite.</text>
    <text x="64" y="270" font-size="21" fill="#53635b">Capture context quickly. Review it in GitHub. Reuse what is trusted.</text>
    <text x="64" y="312" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" fill="#53635b">REVIEWED PAGES · LINKED SOURCES · DOMAIN OWNERS</text>
  </g>
  <g transform="translate(730 61)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <rect width="406" height="256" rx="20" fill="#fffdf8" stroke="#1d2924" stroke-width="2"/>
    <text x="28" y="42" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700" letter-spacing="1.5" fill="#47725d">A REVIEWED PAGE</text>
    <text x="28" y="84" font-size="31" font-weight="750" fill="#1d2924">Knowledge with context</text>
    <path d="M28 108H378" stroke="#d4d0c4"/>
    <rect x="28" y="132" width="350" height="30" rx="9" fill="#e5efe9"/>
    <text x="42" y="153" font-size="18" font-weight="700" fill="#47725d">sources: linked original evidence</text>
    <rect x="28" y="174" width="350" height="30" rx="9" fill="#f4f1e8"/>
    <text x="42" y="195" font-size="18" font-weight="700" fill="#53635b">[E#]: load-bearing steps are traceable</text>
    <rect x="28" y="216" width="350" height="30" rx="9" fill="#1d2924"/>
    <text x="42" y="237" font-size="18" font-weight="700" fill="#f4f1e8">owner: a named domain route</text>
  </g>
</svg>
